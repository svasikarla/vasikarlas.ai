<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NLSQLPro</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#09090f;font-family:system-ui,-apple-system,sans-serif}
.root{position:relative;width:100%;height:100vh;background:#09090f;overflow:hidden}

/* Header */
.hdr{position:absolute;top:0;left:0;right:0;z-index:20;padding:10px 14px;display:flex;align-items:center;gap:10px;background:linear-gradient(#09090f 55%,transparent)}
.hdr-title{font-size:13px;font-weight:700;color:#fff;letter-spacing:-.01em;white-space:nowrap}
.hdr-sub{font-size:10px;color:rgba(255,255,255,.35);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-badge{font-size:9px;letter-spacing:1.2px;border:1px solid rgba(59,130,246,.45);color:#3b82f6;padding:2px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}

/* Slides */
.slides{position:absolute;inset:0}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .5s ease;display:flex;flex-direction:column}
.slide.active{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.slide-gradient{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(9,9,15,.35) 0%,transparent 38%,rgba(9,9,15,.72) 78%)}

/* Caption */
.caption{position:absolute;bottom:48px;left:14px;right:14px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cap-tag{font-size:10px;font-weight:700;color:#3b82f6;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.cap-desc{font-size:11px;color:rgba(255,255,255,.65);line-height:1.4}

/* Controls */
.ctrl{position:absolute;bottom:0;left:0;right:0;z-index:30;padding:5px 12px 8px;background:linear-gradient(transparent,rgba(9,9,15,.96) 70%)}
.prog{height:2px;background:rgba(255,255,255,.12);border-radius:1px;margin-bottom:6px;cursor:pointer;overflow:hidden}
.prog-fill{height:100%;background:#3b82f6;width:0%;transition:width .1s linear}
.ctrl-row{display:flex;align-items:center;gap:8px}
.pbtn{width:20px;height:20px;border-radius:50%;background:#3b82f6;border:none;cursor:pointer;color:#fff;font-size:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.85}
.pbtn:hover{opacity:1}
.dots{display:flex;gap:4px;flex:1}
.dot{width:5px;height:5px;border-radius:3px;background:rgba(255,255,255,.15);cursor:pointer;transition:all .25s}
.dot.on{background:#3b82f6;width:14px}
.tlbl{font-size:9px;color:rgba(255,255,255,.28);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="root">
  <div class="hdr">
    <span class="hdr-title">NLSQLPro</span>
    <span class="hdr-sub">Natural Language to SQL · Production Engine</span>
    <span class="hdr-badge">LIVE APP</span>
  </div>
  <div class="slides">
  <div class="slide active" id="s0">
    <img src="/screenshots/nlsql-pro/landing.png" alt="Platform" >
    <div class="slide-gradient"></div>
    <div class="caption">
      <span class="cap-tag">Platform</span>
      <span class="cap-desc">Production NL-to-SQL Engine</span>
    </div>
  </div>
  <div class="slide" id="s1">
    <img src="/screenshots/nlsql-pro/query.png" alt="Query Engine" >
    <div class="slide-gradient"></div>
    <div class="caption">
      <span class="cap-tag">Query Engine</span>
      <span class="cap-desc">Type English · Get Production SQL</span>
    </div>
  </div></div>
  <div class="ctrl">
    <div class="prog" id="prog"><div class="prog-fill" id="fill"></div></div>
    <div class="ctrl-row">
      <button class="pbtn" id="pbtn">&#9654;</button>
      <div class="dots" id="dots"><span class="dot on" data-i="0"></span><span class="dot" data-i="1"></span></div>
      <span class="tlbl" id="tlbl">0:00 / 0:08</span>
    </div>
  </div>
</div>
<script>
const N=2, DUR=4000, TOTAL=8000;
let cur=0, playing=true, elapsed=0, last=null;
const slides=document.querySelectorAll('.slide');
const fill=document.getElementById('fill');
const tlbl=document.getElementById('tlbl');
const pbtn=document.getElementById('pbtn');
const dots=document.querySelectorAll('.dot');
function show(i){slides.forEach((s,j)=>s.classList.toggle('active',j===i));dots.forEach((d,j)=>d.classList.toggle('on',j===i));}
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function frame(ts){
  if(!playing)return;
  if(last===null)last=ts;
  elapsed=Math.min(elapsed+(ts-last),TOTAL);
  last=ts;
  fill.style.width=(elapsed/TOTAL*100)+'%';
  tlbl.textContent=fmt(elapsed)+' / '+fmt(TOTAL);
  const ni=Math.min(Math.floor(elapsed/DUR),N-1);
  if(ni!==cur){cur=ni;show(cur);}
  if(elapsed>=TOTAL){elapsed=0;cur=0;last=null;show(0);}
  requestAnimationFrame(frame);
}
pbtn.onclick=()=>{playing=!playing;pbtn.innerHTML=playing?'&#9654;':'&#9646;&#9646;';if(playing){last=null;requestAnimationFrame(frame);}};
dots.forEach((d,i)=>d.addEventListener('click',()=>{cur=i;elapsed=i*DUR;last=null;show(cur);fill.style.width=(elapsed/TOTAL*100)+'%';tlbl.textContent=fmt(elapsed)+' / '+fmt(TOTAL);}));
document.getElementById('prog').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();elapsed=(e.clientX-r.left)/r.width*TOTAL;cur=Math.min(Math.floor(elapsed/DUR),N-1);last=null;show(cur);});
show(0);requestAnimationFrame(frame);
</script>
</body>
</html>
